# Muster Fleet Cloud relay — nginx reverse proxy for relay.getmuster.dev
#
# Run the relay on loopback with the real client IP header:
#   MUSTER_CLOUD_LISTEN=127.0.0.1:8443 MUSTER_CLOUD_CLIENT_IP_HEADER=X-Real-IP muster-cloud serve
#
# Behind Cloudflare: uncomment the real_ip block so $remote_addr is the
# client (taken from CF-Connecting-IP only for Cloudflare edge IPs).
#
# Usage:
#   cp relay.conf /etc/nginx/sites-available/muster-relay
#   ln -s /etc/nginx/sites-available/muster-relay /etc/nginx/sites-enabled/
#   certbot --nginx -d relay.getmuster.dev
#   nginx -t && systemctl reload nginx

upstream muster_relay {
    server 127.0.0.1:8443;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.getmuster.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 off; # WebSocket upgrade needs HTTP/1.1
    server_name relay.getmuster.dev;

    ssl_certificate     /etc/letsencrypt/live/relay.getmuster.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.getmuster.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- Cloudflare real client IP (refresh from https://www.cloudflare.com/ips/) ---
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 2400:cb00::/32;
    # set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;
    # set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;
    # set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;
    # real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 64k;

    # Never log query strings or auth headers (the default combined format
    # logs neither headers nor bodies; tokens never travel in URLs).

    location = /v1/tunnel {
        proxy_pass http://muster_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        # Long-lived agent connections (clients heartbeat every 30s).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ ^/(healthz|api/v1/) {
        proxy_pass http://muster_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
